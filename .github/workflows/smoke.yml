name: pqv-smoke
on: [push, workflow_dispatch]
permissions:
  contents: read
  security-events: write
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - run: pip install "pq-verify[full]"
      - run: |
          python - <<'EOF'
          import pathlib, pq_verify
          d = pathlib.Path(pq_verify.__file__).parent / "vectors"
          print("vectors dir:", d, d.exists())
          for f in sorted(d.glob("*"))[:20]:
              print(f.name, f.stat().st_size)
          EOF
      - run: pq-verify --acvp-all
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: bigDSanalyst/pq-verify@v1
        id: pqv
      - run: |
          echo "--- action.yml actually being used ---"
          sed -n '1,20p;/else/,/fi/p' \
            /home/runner/work/_actions/bigDSanalyst/pq-verify/v1/action.yml
          echo "verified=[${{ steps.pqv.outputs.verified }}]"
          echo "findings=[${{ steps.pqv.outputs.findings }}]"
          echo "sarif=[${{ steps.pqv.outputs.sarif-file }}]"
          echo "--- sarif on disk ---"
          find /home/runner/work -name '*.sarif' 2>/dev/null || true
          echo "--- json on disk ---"
          find /home/runner/work -name '*.json' -newermt '-10 minutes' 2>/dev/null | head -20
      - uses: actions/upload-artifact@v4
        if: always() && steps.pqv.outputs.sarif-file != ''
        with:
          name: pqv-sarif
          path: ${{ steps.pqv.outputs.sarif-file }}
      - uses: github/codeql-action/upload-sarif@v3
        if: steps.pqv.outputs.sarif-file != ''
        with:
          sarif_file: ${{ steps.pqv.outputs.sarif-file }}
