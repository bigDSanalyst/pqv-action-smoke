name: pqv-negative
on: workflow_dispatch
jobs:
  broken-so:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > bad.c <<'EOF'
          #include <stdint.h>
          void ntt(int16_t *a){ (void)a; }
          EOF
          gcc -O2 -shared -fPIC -o bad.so bad.c
          nm -D bad.so | grep -i ntt
      - uses: bigDSanalyst/pq-verify@v1
        id: pqv
        continue-on-error: true
        with:
          library: bad.so
          symbol: ntt
      - run: |
          echo "outcome=${{ steps.pqv.outcome }}"
          echo "verified=[${{ steps.pqv.outputs.verified }}]"
          echo "findings=[${{ steps.pqv.outputs.findings }}]"
          echo "sarif=[${{ steps.pqv.outputs.sarif-file }}]"
          test "${{ steps.pqv.outcome }}" = "failure" \
            || { echo "IDENTITY NTT PASSED - do not tag v1"; exit 1; }
          test "${{ steps.pqv.outputs.verified }}" = "false" \
            || { echo "verified was not false - do not tag v1"; exit 1; }
          test "${{ steps.pqv.outputs.findings }}" -gt 0 2>/dev/null \
            || { echo "failed with zero findings - plumbing failure, not detection"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broken-so-sarif
          path: pq-verify.sarif
          if-no-files-found: warn

  no-gcc:
    runs-on: ubuntu-latest
    steps:
      - name: Hide the toolchain
        run: |
          mkdir -p /tmp/nogcc
          for f in $(command -v gcc g++ cc c++ 2>/dev/null); do
            echo "would hide $f"
          done
          echo "PATH=/tmp/nogcc:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> $GITHUB_ENV
          printf '#!/bin/sh\nexit 127\n' > /tmp/nogcc/apt-get
          chmod +x /tmp/nogcc/apt-get
      - uses: bigDSanalyst/pq-verify@v1
        id: pqv
        continue-on-error: true
      - run: |
          echo "outcome=${{ steps.pqv.outcome }}"
          echo "verified=[${{ steps.pqv.outputs.verified }}]"
          test "${{ steps.pqv.outcome }}" = "failure" \
            || { echo "DEGRADED RUN REPORTED CLEAN - do not tag v1"; exit 1; }
          test "${{ steps.pqv.outputs.verified }}" != "true" \
            || { echo "verified=true on a degraded run - do not tag v1"; exit 1; }

  from-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: bigDSanalyst/pq-verify@v1
        with:
          version: pypi
